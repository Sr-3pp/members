on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest
    
    steps:
    - name: install ssh keys
      # check this thread to understand why its needed:
      # https://stackoverflow.com/a/70447517
      run: |
        install -m 600 -D /dev/null ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
        
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14
    
    
    - name: Connect pull and build
      run: "ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} && cd ${{ secrets.WORK_DIR }} && git checkout ${{ secrets.MAIN_BRANCH }} && git pull && export NVM_DIR=~/.nvm && source ~/.nvm/nvm.sh && npm install && npm run production && exit"
    
    - name: cleanup
      run: rm -rf ~/.ssh