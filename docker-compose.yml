version: '3'
services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - '8000:80'
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    env_file:
      - .env
  mysql:
    image: mysql:8.0
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
